<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدول المباريات</title>
<style>
:root{
  --page-bg:#232323;        /* لون خلفية الصفحة حول البوستر */
  --card1:#6d28d9;          /* أعلى تدرج البوستر */
  --card2:#4c1d95;          /* أسفل تدرج البوستر */
  --pill1:#ffffff;          /* لون كبسولة المباراة */
  --pill2:#f3f0ff;
  --accent:#f5a623;         /* لون VS والخط تحت العنوان */
  --ink:#1f1530;            /* لون الكتابة الداكن */
  --muted:#7a7191;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page-bg);font-family:Tahoma,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 12px;color:var(--ink)}
.poster{width:800px;max-width:100%;background:linear-gradient(160deg,var(--card1),var(--card2));border-radius:24px;padding:44px 36px 52px;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.45)}
h1{font-size:42px;text-align:center;line-height:1.6;font-weight:bold}
.accent-line{width:90px;height:5px;border-radius:3px;background:var(--accent);margin:8px auto 26px}
.section-title{text-align:center;font-size:26px;opacity:.95;margin-bottom:6px}
.hint{text-align:center;font-size:14px;opacity:.7;margin-bottom:6px}
.day{margin-top:24px}
.day-date{text-align:center;font-size:22px;font-weight:bold;margin-bottom:12px}
.match{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:linear-gradient(180deg,var(--pill1),var(--pill2));border-radius:60px;padding:20px 30px;margin:14px 0;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18);transition:transform .15s,box-shadow .15s}
.match:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.team{flex:1;min-width:0;font-size:24px;font-weight:bold;color:var(--ink);line-height:1.5;overflow-wrap:anywhere;word-break:break-word}
.team.away{text-align:left}
.mid{flex:0 0 auto;text-align:center;min-width:90px;max-width:40%}
.vs{color:var(--accent);font-weight:bold;font-size:18px}
.time{font-size:30px;font-weight:bold;color:var(--ink);overflow-wrap:anywhere}
.period{font-size:14px;color:var(--muted)}
.team.win{color:#15803d}
.team.win:before{content:"\1F3C6 "}
.res{flex-basis:100%;order:9;text-align:center;font-size:15px;font-weight:bold;color:#15803d;margin-top:-4px}
.popup .pres{background:#e8f8ee;color:#15803d;border:1px solid #b7e4c7;border-radius:12px;padding:10px 14px;font-weight:bold;font-size:18px;margin-bottom:14px}
.textcard{background:linear-gradient(180deg,var(--pill1),var(--pill2));border-radius:24px;padding:20px 26px;margin:16px 0;color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.textcard .tc-title{font-size:20px;font-weight:bold;margin-bottom:8px;color:var(--card2)}
.textcard .tc-body{font-size:18px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}
.footer-note{text-align:center;font-size:13px;opacity:.6;margin-top:26px;color:#fff}
.fallback{text-align:center;font-size:20px;line-height:2;padding:30px 10px}
/* نافذة التفاصيل */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.open{display:flex}
.popup{background:#fff;color:var(--ink);border-radius:20px;max-width:540px;width:100%;max-height:85vh;overflow:auto;padding:30px 28px;position:relative;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.popup .close{position:absolute;top:12px;left:14px;border:none;background:#eee;color:#333;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer;line-height:1}
.popup .close:hover{background:#ddd}
.popup h2{font-size:24px;line-height:1.7;margin:0 0 4px;padding-left:34px;overflow-wrap:anywhere}
.popup .pmeta{color:var(--accent);font-weight:bold;font-size:19px;margin-bottom:14px}
.popup .pdetails a.wa{color:#128c4a;font-weight:bold;text-decoration:underline;direction:ltr;unicode-bidi:isolate;overflow-wrap:normal}
.popup .pdetails{font-size:18px;line-height:2;white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid #eee;padding-top:14px}
@media (max-width:620px){
  h1{font-size:29px}
  .section-title{font-size:20px}
  .team{font-size:17px}
  .time{font-size:21px}
  .vs{font-size:15px}
  .mid{min-width:64px}
  .match{padding:14px 16px;gap:8px;border-radius:34px}
  .poster{padding:30px 14px 38px;border-radius:18px}
  .day-date{font-size:18px}
}
</style>
</head>
<body>
<div class="poster" id="poster">
  <div class="fallback" id="fallback">
    الصفحة مش قادرة تعرض الجدول.<br>
    فيه غلطة في «منطقة التعديل» آخر الملف، غالبًا علامة ترقيم اتمسحت بالغلط.<br>
    راجع آخر تعديل عملته، أو قارنه بنسخة سليمة من الملف.
  </div>
</div>
<div class="overlay" id="overlay">
  <div class="popup" id="popup">
    <button class="close" id="closeBtn" aria-label="إغلاق">&times;</button>
    <h2 id="pTitle"></h2>
    <div class="pmeta" id="pMeta"></div>
    <div class="pres" id="pRes" style="display:none"></div>
    <div class="pdetails" id="pDetails"></div>
  </div>
</div>
<script>
/* لو حصل أي خطأ في الكود، الرسالة اللي فوق بتفضل ظاهرة بدل صفحة فاضية */
window.addEventListener("error",function(){
  var f=document.getElementById("fallback");
  if(f){f.style.display="block";}
});
</script>
<script>
/* =========================================================================
   منطقة التعديل: كل محتوى الصفحة يتغيّر من هذا الجزء فقط
   -------------------------------------------------------------------------
   - title        : العنوان الكبير أعلى الصفحة (ممكن يبقى أكتر من سطر)
   - sectionTitle : السطر الصغير تحت العنوان
   - days         : الأيام، وكل يوم له date (التاريخ) و matches (المباريات)
   - كل مباراة:
       team1    : اسم الفريق الأول (يظهر يمين الكبسولة)
       team2    : اسم الفريق الثاني (يظهر شمال الكبسولة)
       time     : الميعاد مثل 10:00 (اتركه فاضي لو مش عايز ميعاد)
       period   : كلمة صغيرة تحت الميعاد مثل مساءً (اتركها فاضية لو مش عايزها)
       details  : التفاصيل اللي تظهر في النافذة لما الزائر يضغط على المباراة.
                  اكتب عادي، كل سطر في سطر، من غير أي رموز.
       result   : نتيجة المباراة مثل: فاز رقم 2 على رقم 3 بنتيجة 4 / 1 (اتركها فاضية لو لسه ما لعبوش)
       winner   : اكتب 1 لو الفريق الأول فاز، أو 2 لو التاني فاز، واتركها فاضية لو مفيش فايز
   - texts        : صناديق نص حر تظهر أسفل المباريات (اختياري)
                    كل صندوق له title (اتركه فاضي لإخفائه) و body
   قواعد مهمة:
   - كل نص محطوط بين علامتين ` ` (العلامة دي مش علامة تنصيص عادية).
     جواها تقدر تكتب براحتك: سطور جديدة، علامات تنصيص " أو ' ، أرقام، أي حاجة.
     الحاجة الوحيدة الممنوعة جوا النص هي علامة ` نفسها و ${ .
   - انسخ أي بلوك مباراة كامل (من { لـ },) والصقه لإضافة مباراة جديدة،
     واحذف البلوك كله لحذفها.
   - بلاش تمسح الرموز اللي بره النصوص: { } [ ] والفاصلة , آخر كل سطر.
   - الألوان تتغيّر من أعلى الملف داخل :root (كل لون له شرح بجانبه).
   ========================================================================= */
const DATA = {
  title: `مسابقة بطرس لشهر 12
التصفيات الاولي يوم السبت والحد`,
  sectionTitle: `المباريات`,
  days: [
    {
      date: ``,
      matches: [
        {
          team1: `رقم 1 بطل النسخة السابقة`,
          team2: `رقم 9`,
          time: `11:00`,
          period: `انتهت`,
          result: `فاز رقم 1 على رقم 9 بنتيجة 4 / 1`,
          winner: `1`,
          details: `رقم 1
رقم موبايله 01080277690
هيلعب مع 
رقم 9
رقم موبايله 01009526378`
        }
      ]
    },
	{
      date: ``,
      matches: [
        {
          team1: `رقم 2`,
          team2: `رقم 3`,
          time: `01:00`,
          period: `انتهت`,
          result: `فاز رقم 2 على رقم 3 بنتيجة 4 / 1`,
          winner: `1`,
          details: `رقم 2
رقم موبايله 010310805544
هيلعب مع 
رقم 3
رقم موبايله 01551738902`
        }
      ]
    },
		{
      date: ``,
      matches: [
        {
          team1: `رقم 5`,
          team2: `رقم 4`,
          time: ``,
          period: ``,
          result: ``,
          winner: ``,
          details: `رقم 5
رقم موبايله 01555671512
هيلعب مع 
رقم 4
رقم موبايله 01092755052`
        }
      ]
    },
    {
      date: ``,
      matches: [
        {
          team1: `رقم 10`,
          team2: `رقم 6`,
          time: `12:30`,
          period: `السبت`,
          result: ``,
          winner: ``,
          details: `رقم 10
رقم موبايله 01090652665
هيلعب مع 
رقم 6
رقم موبايله 01096114900`
        }
      ]
    }, 
      {
      date: ``,
      matches: [
        {
          team1: `رقم 7`,
          team2: `رقم 8`,
          time: ``,
          period: ``,
          result: ``,
          winner: ``,
          details: `رقم 7
رقم موبايله 01050963827
هيلعب مع 
رقم 8
رقم موبايله 01069088496`
        }
      ]
    }
  ],
  
  texts: [],
  footer: ``   /* سطر صغير جدًا أسفل الصفحة، اتركه فاضي لإخفائه */
};
/* ==================== نهاية منطقة التعديل ==================== */

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
const poster=document.getElementById("poster");
let html="";
html+='<h1>'+esc(DATA.title).replace(/\n/g,"<br>")+'</h1>';
html+='<div class="accent-line"></div>';
if(DATA.sectionTitle){html+='<div class="section-title">'+esc(DATA.sectionTitle)+'</div>';}
html+='<div class="hint">اضغط على أي مباراة لعرض التفاصيل</div>';
(DATA.days||[]).forEach(function(day,di){
  html+='<div class="day">'
    +(day.date?'<div class="day-date">'+esc(day.date)+'</div>':'');
  (day.matches||[]).forEach(function(m,mi){
    html+='<div class="match" data-d="'+di+'" data-m="'+mi+'">'
      +'<div class="team home'+(String(m.winner).trim()==="1"?' win':'')+'">'+esc(m.team1)+'</div>'
      +'<div class="mid"><div class="vs">VS</div>'
      +(m.time?'<div class="time">'+esc(m.time)+'</div>':'')
      +(m.period?'<div class="period">'+esc(m.period)+'</div>':'')
      +'</div>'
      +'<div class="team away'+(String(m.winner).trim()==="2"?' win':'')+'">'+esc(m.team2)+'</div>'
      +(m.result?'<div class="res">'+esc(m.result)+'</div>':'')
      +'</div>';
  });
  html+='</div>';
});
(DATA.texts||[]).forEach(function(t){
  html+='<div class="textcard">'
    +(t.title?'<div class="tc-title">'+esc(t.title)+'</div>':'')
    +'<div class="tc-body">'+esc(t.body)+'</div></div>';
});
if(DATA.footer){html+='<div class="footer-note">'+esc(DATA.footer)+'</div>';}
poster.innerHTML=html;

const overlay=document.getElementById("overlay");
function openMatch(di,mi,push){
  const day=DATA.days&&DATA.days[di];
  const m=day&&day.matches&&day.matches[mi];
  if(!m)return;
  document.getElementById("pTitle").textContent=m.team1+" × "+m.team2;
  const meta=[day.date,m.time,m.period].filter(Boolean).join(" - ");
  document.getElementById("pMeta").textContent=meta;
  var pr=document.getElementById("pRes");
  pr.textContent=m.result||"";pr.style.display=m.result?"block":"none";
  fillDetails(document.getElementById("pDetails"),m.details||"");
  overlay.classList.add("open");
  if(push!==false){history.replaceState(null,"","#m-"+di+"-"+mi);}
}
function waNumber(raw){
  var d=raw.replace(/\D/g,"");
  if(d.indexOf("00")===0)d=d.slice(2);
  else if(d.charAt(0)==="0")d="20"+d.slice(1);
  return d;
}
function fillDetails(el,text){
  el.textContent="";
  var re=/\+?\d[\d \-]{7,16}\d/g,last=0,mt;
  while((mt=re.exec(text))!==null){
    var digits=mt[0].replace(/\D/g,"");
    if(digits.length<9||digits.length>15)continue;
    if(mt.index>last)el.appendChild(document.createTextNode(text.slice(last,mt.index)));
    var a=document.createElement("a");
    a.href="https://wa.me/"+waNumber(mt[0]);
    a.target="_blank";a.rel="noopener";
    a.className="wa";a.textContent=mt[0];
    el.appendChild(a);
    last=mt.index+mt[0].length;
  }
  if(last<text.length)el.appendChild(document.createTextNode(text.slice(last)));
}
function closePopup(){
  overlay.classList.remove("open");
  history.replaceState(null," ",location.pathname+location.search);
}
poster.addEventListener("click",function(e){
  const row=e.target.closest(".match");
  if(row){openMatch(+row.dataset.d,+row.dataset.m);}
});
document.getElementById("closeBtn").addEventListener("click",closePopup);
overlay.addEventListener("click",function(e){if(e.target===overlay)closePopup();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closePopup();});
(function(){
  const h=location.hash.match(/^#m-(\d+)-(\d+)$/);
  if(h){openMatch(+h[1],+h[2],false);}
})();
</script>
</body>
</html>
