<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Authorization</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 70px auto;
      padding: 20px;
      line-height: 1.6;
    }

    .box {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 10px;
      word-break: break-all;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #c62828;
    }
  </style>
</head>

<body>

<h1>TikTok Authorization</h1>

<div id="result" class="box">
  Processing TikTok authorization...
</div>

<script>
  const params = new URLSearchParams(window.location.search);

  const code = params.get("code");
  const state = params.get("state");
  const error = params.get("error");
  const errorDescription = params.get("error_description");

  const result = document.getElementById("result");

  if (code) {
    result.innerHTML =
      '<h2 class="success">Authorization successful</h2>' +
      '<p>Authorization Code:</p>' +
      '<strong>' + code + '</strong>' +
      '<p>State:</p>' +
      '<strong>' + (state || 'Not provided') + '</strong>' +
      '<p>Return to the application to complete setup.</p>';
  } else if (error) {
    result.innerHTML =
      '<h2 class="error">Authorization failed</h2>' +
      '<p>' + error + '</p>' +
      '<p>' + (errorDescription || '') + '</p>';
  } else {
    result.innerHTML =
      '<p>No authorization code was received.</p>';
  }
</script>

</body>
</html>
